<title>サプライチェーン地図</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Sans+JP:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: header with search, then a vertical "line" spine of stage stations, plus a band chart where each multi-stage company gets its own column */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --ink:#15212b; --muted:#5b6873; --line:#d5dbe1;
  --util:#0f6e5c; --util-bg:#e2f3ee; --sup:#4b43a6; --sup-bg:#ecebfb; --volt:#c98a00;
  --debt:#4b43a6; --hyb:#c98a00; --eq:#0f6e5c; --warn:#9a5b00; --warn-bg:#fbf0dc;
  --display:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --body:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --fs-xs:1rem; --fs-sm:1.0625rem; --fs-md:1.125rem;   /* 文字サイズは3段階。16px・17px・18px（見出しは別）。16px未満は作らない */
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --panel:#17212a; --ink:#e4eaef; --muted:#97a4ae; --line:#2b3843;
  --util:#5ccfb4; --util-bg:#123029; --sup:#a9a3f2; --sup-bg:#221f45; --volt:#f0b93a;
  --debt:#8f88ea; --hyb:#e0a630; --eq:#4cbfa4; --warn:#f0b93a; --warn-bg:#33270f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --panel:#17212a; --ink:#e4eaef; --muted:#97a4ae; --line:#2b3843;
  --util:#5ccfb4; --util-bg:#123029; --sup:#a9a3f2; --sup-bg:#221f45; --volt:#f0b93a;
  --debt:#8f88ea; --hyb:#e0a630; --eq:#4cbfa4; --warn:#f0b93a; --warn-bg:#33270f; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs-md);line-height:1.7}
.wrap{max-width:880px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--display);font-weight:700;font-size:1.75rem;margin:0;text-wrap:balance;letter-spacing:.02em}
h2{font-family:var(--display);font-weight:700;font-size:1.5rem;margin:0 0 4px;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:1.25rem;margin:0 0 4px}
.lede{color:var(--muted);margin:4px 0 14px;font-size:var(--fs-md);max-width:62ch}
a{color:inherit}
:focus-visible{outline:2px solid var(--volt);outline-offset:2px}

/* industry switch + nav */
.inds{display:flex;gap:4px;flex-wrap:wrap;margin:12px 0 4px}
.inds a{text-decoration:none;font-family:var(--display);font-weight:700;font-size:var(--fs-md);padding:6px 14px;border-radius:8px;color:var(--muted);border:1px solid transparent}
.inds a[aria-current="page"]{color:var(--ink);background:var(--panel);border-color:var(--line)}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;scrollbar-width:thin}
nav a{flex:none;text-decoration:none;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:var(--fs-sm);background:var(--panel)}
nav a[aria-current="page"]{color:var(--bg);background:var(--ink);border-color:var(--ink)}
section+section{margin-top:28px}
.sec-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sec-head p{margin:0;color:var(--muted);font-size:var(--fs-sm)}

/* spine */
.spine{position:relative;display:flex;flex-direction:column;gap:14px;padding-left:22px}
.spine::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:repeating-linear-gradient(var(--volt) 0 8px,transparent 8px 13px)}
.station{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.station::before{content:"";position:absolute;left:-21px;top:18px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--volt)}
.st-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.st-name{font-family:var(--display);font-weight:700;font-size:var(--fs-md);text-decoration:none}
.st-sub{color:var(--muted);font-size:var(--fs-sm)}
.st-more{margin-left:auto;color:var(--muted);font-size:var(--fs-sm);text-decoration:none}
.st-more:hover,.st-name:hover{text-decoration:underline}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.co{display:block;text-decoration:none;border-radius:8px;padding:7px 10px;border:1px solid transparent;min-width:0}
.co.u{background:var(--util-bg);color:var(--util)}
.co.s{background:var(--sup-bg);color:var(--sup)}
.co.unl{background:transparent;border:1.5px dashed currentColor}
.co b{display:block;font-weight:500;font-size:var(--fs-md);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.co .lst{font-size:var(--fs-xs)}
a.co:hover b{text-decoration:underline}
.cross{margin:8px 0 0;font-size:var(--fs-sm);color:var(--muted)}
.cross a{color:var(--ink)}
.demand .st-head{margin:0}

/* metrics */
.metric{font-family:var(--mono);font-size:var(--fs-xs);font-variant-numeric:tabular-nums;white-space:nowrap}
.metric .k{font-family:var(--body);margin-right:4px}
.flag{display:inline-block;font-family:var(--body);font-size:var(--fs-xs);color:var(--warn);background:var(--warn-bg);border-radius:4px;padding:0 5px;margin-left:4px;vertical-align:1px}

/* band chart */
.band-scroll{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px}
.band{display:grid;column-gap:6px;row-gap:0;min-width:max-content}
.band .rl{position:sticky;left:0;z-index:1;background:var(--panel);font-size:var(--fs-xs);color:var(--muted);padding-right:8px;display:flex;align-items:center;min-height:0;border-top:1px solid var(--line)}
.band .rl a{color:var(--ink);text-decoration:none;line-height:1.3}
.band .ch{font-size:var(--fs-xs);text-align:center;line-height:1.25;padding-bottom:6px;display:flex;align-items:flex-end;justify-content:center;min-height:34px}
.band .ch a{text-decoration:none;color:var(--ink)}
.band .ch a:hover{text-decoration:underline}
.band .cell{min-height:0;align-self:stretch;position:relative;background:linear-gradient(var(--line),var(--line)) top/100% 1px no-repeat}
.band .cell.on::after{content:"";position:absolute;left:6px;right:6px;top:0;bottom:0}
.band .cell.on.u::after{background:var(--util)}
.band .cell.on.s::after{background:var(--sup)}
.band .cell.on.unl::after{background:transparent;border-left:2px dashed var(--util);border-right:2px dashed var(--util)}
.band .cell.on.unl.s::after{border-color:var(--sup)}
.band .cell.on:not(.top)::after{top:-1px}
.band .cell.on.top::after{top:5px;border-top-left-radius:6px;border-top-right-radius:6px}
.band .cell.on.bot::after{bottom:5px;border-bottom-left-radius:6px;border-bottom-right-radius:6px}
.band .cell.on.unl.top::after{border-top:2px dashed var(--util)}
.band .cell.on.unl.bot::after{border-bottom:2px dashed var(--util)}
.band .cell.on.unl.s.top::after,.band .cell.on.unl.s.bot::after{border-color:var(--sup)}
.band .cell.gap::after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px dotted var(--muted);transform:translateX(-1px)}
.band-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px;font-size:var(--fs-xs);color:var(--muted)}
.band-legend span{display:inline-flex;align-items:center;gap:6px}
.scroll-hint{font-size:var(--fs-xs);color:var(--muted);margin:0 0 6px}

/* support box */
.support{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.support div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.support b{display:block;font-weight:500;font-size:var(--fs-md)}
.support p{margin:2px 0 4px;font-size:var(--fs-sm);color:var(--muted)}
.support a{font-size:var(--fs-xs)}

/* mini band in rows */
.mini{display:inline-flex;gap:2px;vertical-align:middle}
.mini i{width:14px;height:6px;border-radius:2px;background:var(--line)}
.mini i.on{background:var(--volt)}

/* sector detail */
.flowbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:var(--fs-sm);color:var(--muted);margin-bottom:14px}
.flowbar a{color:var(--muted)}
.flowbar strong{color:var(--ink);font-weight:500}
.role{max-width:62ch;margin:0 0 18px}
.rows{display:flex;flex-direction:column;gap:10px}
.row{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:6px;min-width:0}
.row.unl{border-style:dashed;border-width:1.5px}
.row-top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.row-top b{font-weight:500;font-size:var(--fs-md)}
.tag{font-size:var(--fs-xs);border-radius:999px;padding:1px 8px;white-space:nowrap}
.tag.u{background:var(--util-bg);color:var(--util)}
.tag.s{background:var(--sup-bg);color:var(--sup)}
.tag.x{background:transparent;border:1px solid var(--line);color:var(--muted)}
.row-top .metric{margin-left:auto;font-size:var(--fs-md)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.bar i.rev{background-image:repeating-linear-gradient(135deg,transparent 0 3px,var(--panel) 3px 5px)}
.note{color:var(--muted);font-size:var(--fs-sm);min-width:0}
.links{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:var(--fs-sm)}
.links a{color:var(--ink)}
.pill{font-size:var(--fs-xs);border:1px dashed var(--line);color:var(--muted);border-radius:999px;padding:1px 9px;cursor:not-allowed}
a.pill-on{font-size:var(--fs-xs);border:1px solid var(--volt);border-radius:999px;padding:1px 9px;text-decoration:none}
.sub-h{font-size:var(--fs-sm);color:var(--muted);margin:18px 0 8px;letter-spacing:.04em}

/* company page */
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin:14px 0}
.fact{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.fact .k{display:block;font-size:var(--fs-xs);color:var(--muted)}
.fact .v{font-family:var(--mono);font-size:var(--fs-md);font-variant-numeric:tabular-nums}
.fact .d{display:block;font-size:var(--fs-xs);color:var(--muted);margin-top:2px}
.stage-links{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0}
.stage-links a{display:block;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--volt);border-radius:0;padding:8px 12px;min-width:0;flex:1 1 220px}
.stage-links a b{display:block;font-weight:500}
.stage-links a span{font-size:var(--fs-sm);color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:4px 20px}
.two>div{min-width:0}
ul.plain{margin:0;padding-left:1.1em;font-size:var(--fs-sm);display:grid;gap:5px}
.callout{margin:14px 0 0;padding:10px 12px;border-left:4px solid var(--volt);border-radius:0;background:var(--bg);font-size:var(--fs-sm)}
.src{margin:10px 0 0;font-size:var(--fs-xs);color:var(--muted)}
.src a{color:var(--muted)}
.graph-scroll{overflow-x:auto}
.graph-scroll svg{display:block;width:100%;min-width:640px;height:auto}
.graph{font-family:var(--body)}
.graph .g-edge{stroke:var(--muted);stroke-width:1.5}
.graph .g-head{fill:var(--muted)}
.graph .g-lbl rect{fill:var(--panel);stroke:var(--line)}
.graph .g-pct{fill:var(--ink);font:500 14px var(--mono)}
.graph .g-sub{fill:var(--muted);font-size:14px}
.graph .g-warn{fill:var(--warn);font-size:14px}
.graph .g-name{fill:var(--ink);font-size:15px;font-weight:500}
.graph .g-node{fill:var(--panel);stroke:var(--line);stroke-width:1}
.graph .g-node.unl{stroke-dasharray:5 3}
.graph .g-node.focus{fill:var(--util-bg);stroke:var(--volt);stroke-width:2}
.graph .g-link .g-node{stroke:var(--util);stroke-width:1.5}
.graph .g-link:hover .g-node{stroke:var(--volt)}
.stack{display:flex;height:34px;border-radius:6px;overflow:hidden;margin:10px 0 6px}
.stack div{display:flex;align-items:center;justify-content:center;font-size:var(--fs-xs);color:var(--bg);font-family:var(--mono);min-width:0;overflow:hidden;white-space:nowrap}
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-top:10px}
.totals div{border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.totals .k{display:block;font-size:var(--fs-xs);color:var(--muted)}
.totals .v{font-family:var(--mono);font-variant-numeric:tabular-nums}
.cap-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:12px}
.cap-list h4{margin:0 0 6px;font-size:var(--fs-sm);font-weight:500;display:flex;align-items:center;gap:6px}
.cap-list h4 i{width:10px;height:10px;border-radius:2px;display:inline-block}
.cap-list table{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
.cap-list th{font-size:var(--fs-xs);font-weight:400;color:var(--muted);text-align:right;padding:0 0 4px 8px}
.cap-list td{padding:4px 0;border-top:1px solid var(--line);vertical-align:top}
.cap-list td.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:8px}
.cap-list td small{display:block;color:var(--muted);font-size:var(--fs-xs)}
.cap-list .na{color:var(--muted);font-family:var(--body)}
.cap-list .na small{display:block}
.cap-list tr.sum td{font-weight:500}

.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:var(--fs-sm);color:var(--muted);margin:18px 0 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.foot{margin-top:24px;font-size:var(--fs-xs);color:var(--muted);max-width:72ch}
@media (prefers-reduced-motion:no-preference){main>*{animation:fade .25s ease-out}@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}

/* header, search, home */
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.brand{font-family:var(--display);font-weight:700;font-size:var(--fs-md);text-decoration:none;color:var(--muted)}
.brand:hover{color:var(--ink)}
.search{position:relative;flex:1 1 220px;max-width:360px;margin-left:auto;min-width:0}
.search input{width:100%;box-sizing:border-box;font:inherit;font-size:var(--fs-md);padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.qres{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;max-height:60vh;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.qres a{display:block;padding:7px 10px;border-radius:6px;text-decoration:none;font-size:var(--fs-md)}
.qres a:hover,.qres a.sel{background:var(--bg)}
.qres small{display:block;color:var(--muted);font-size:var(--fs-xs)}
.qres p{margin:6px 10px;color:var(--muted);font-size:var(--fs-sm)}
.crumbs{font-size:var(--fs-sm);color:var(--muted);margin-bottom:6px;display:flex;gap:6px;flex-wrap:wrap}
.crumbs a{color:var(--muted)}
#head nav{margin-top:2px}
#head .row-top h1{margin:0}
.ind-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ind-card{display:flex;flex-direction:column;gap:6px;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.ind-card:hover{border-color:var(--muted)}
.ind-card b{font-family:var(--display);font-weight:700;font-size:1.2rem}
.ind-card p{margin:0;font-size:var(--fs-sm);color:var(--muted)}
.ind-card .chain{display:flex;flex-wrap:wrap;gap:2px 0;font-size:var(--fs-xs);color:var(--ink)}
.ind-card .chain span:not(:last-child)::after{content:"→";color:var(--volt);margin:0 4px}
.ind-card .cnt{font-family:var(--mono);font-size:var(--fs-xs);color:var(--muted)}
section.area+section.area{margin-top:22px}
.area .sec-head h3{margin:0}
.area.empty .sec-head h3{color:var(--muted)}
.planned{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
.planned .k{font-size:var(--fs-xs);color:var(--muted);margin-right:2px}
a.row-name{font-weight:500;font-size:var(--fs-md);text-decoration:none}
a.row-name:hover{text-decoration:underline}
.net-scroll{overflow-x:auto}
.net-scroll svg{display:block;width:100%;height:auto;margin:0 auto}
.net{font-family:var(--body)}
.net .n-area{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
.net .n-area.empty{fill:none;stroke-dasharray:5 4}
.net .n-alabel{fill:var(--muted);font-size:15px;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.net .n-alabel.empty{opacity:.75}
.net g:focus{outline:none}
.net .n-node:focus-visible rect{stroke:var(--volt);stroke-width:3}
.net .n-edge:focus-visible .line{stroke:var(--volt)}
.net .n-node{cursor:pointer}
.net .n-node rect{fill:var(--util-bg);stroke:var(--util);stroke-width:1.5}
.net .n-node text{fill:var(--ink);font-size:16px;font-weight:600}
.net .n-node.sel rect{stroke:var(--volt);stroke-width:3}
.net .n-edge{cursor:pointer}
.net .n-edge .hit{fill:none;stroke:transparent;stroke-width:18}
.net .n-edge .line{fill:none;stroke:var(--muted)}
.net .n-edge .cnt{fill:var(--panel);stroke:var(--muted)}
.net .n-edge text{fill:var(--ink);font:600 16px var(--mono)}
.net.has-sel .n-edge{opacity:.22}
.net.has-sel .n-edge.on{opacity:1}
.net.has-sel .n-edge.on .line{stroke:var(--volt)}
.net .g-head{fill:var(--muted)}
.net.has-sel .n-edge.on .g-head{fill:var(--volt)}
.net-link{display:inline-block;margin-top:2px;font-size:var(--fs-sm)}
.deps{display:grid;gap:8px;margin-top:6px}
.dep{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.dep .flow{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;font-size:var(--fs-sm)}
.dep .flow a{color:var(--ink);font-weight:600;text-decoration:none;border-bottom:1px solid var(--line)}
.dep .flow a:hover{border-bottom-color:var(--muted)}
.dep .flow i{font-style:normal;color:var(--volt)}
.dep p{margin:4px 0 0;font-size:var(--fs-sm);color:var(--muted)}
.dep-h{font-size:var(--fs-xs);color:var(--muted);margin:12px 0 0}
.research{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:12px;counter-reset:r}
.research li{counter-increment:r;position:relative;padding-left:30px;min-width:0}
.research li::before{content:counter(r);position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:1px solid var(--line);font:600 var(--fs-xs)/20px var(--mono);text-align:center;color:var(--muted)}
.research b{font-size:var(--fs-sm)}
.research p{margin:2px 0 4px;font-size:var(--fs-sm);color:var(--muted)}
.research a{font-size:var(--fs-sm);overflow-wrap:anywhere}
.ind-roles{display:flex;flex-direction:column;gap:14px}
.ind-role-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.ind-role-head a{font-family:var(--display);font-weight:700;text-decoration:none}
.ind-role-head a:hover{text-decoration:underline}
</style>

<div class="wrap">
  <header class="top">
    <a class="brand" href="#home">サプライチェーン地図</a>
    <div class="search">
      <input id="q" type="search" placeholder="会社名で探す" aria-label="会社名で探す" autocomplete="off">
      <div id="qres" class="qres" hidden></div>
    </div>
  </header>
  <div id="head"></div>
  <main id="view"><p class="note">データを読み込んでいます…</p></main>
  <div class="legend" id="legend"></div>
